# ---------------------------------------------------------------------------
#  CI - i controlli che girano su OGNI pull request.
#
#  Tre gate indipendenti: struttura, segreti, applicazione. Se uno diventa
#  rosso la pull request non si puo' unire (main ha i required status checks).
#  Il gate applicazione guarda anche l'ARTEFATTO: test verdi sul codice non
#  bastano se poi la pagina generata perde un avviso.
# ---------------------------------------------------------------------------
name: CI

# Su OGNI pull request verso main e sui push diretti a main.
# workflow_dispatch resta per poterlo lanciare a mano quando serve.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -------------------------------------------------- GATE 1: struttura (ESEMPIO GIA' FATTO)
  struttura:
    name: Gate struttura - i file ci sono ancora?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: I file indispensabili non sono stati cancellati
        run: |
          for f in data/avvisi.json src/build.mjs test/bacheca.test.mjs package.json; do
            if [ ! -f "$f" ]; then
              echo "manca $f: non si passa"
              exit 1
            fi
          done
          echo "struttura del progetto integra"

  # -------------------------------------------------- GATE 2: segreti
  segreti:
    name: Gate segreti - niente credenziali nel repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nessuna credenziale nel repository
        run: |
          chmod +x script/sniffa-segreti.sh
          ./script/sniffa-segreti.sh .

  # -------------------------------------------------- GATE 3: applicazione
  applicazione:
    name: Gate applicazione - dipendenze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa le dipendenze del lockfile
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Guarda il RISULTATO della build, non il sorgente: se la pagina perde un
      # avviso i test sul codice possono essere ancora verdi, questo no.
      - name: Smoke test sull'artefatto
        run: |
          test -s dist/index.html || { echo "dist/index.html mancante o vuoto"; exit 1; }
          attesi=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/avvisi.json','utf8')).avvisi.length)")
          trovati=$(grep -c '<td class="cod">' dist/index.html || true)
          echo "avvisi nei dati: $attesi - righe nella pagina: $trovati"
          if [ "$trovati" -ne "$attesi" ]; then
            echo "la pagina generata non corrisponde a data/avvisi.json"
            exit 1
          fi

      - name: Carica l'artefatto sito
        uses: actions/upload-artifact@v4
        with:
          name: sito
          path: dist/
          retention-days: 7
