# ---------------------------------------------------------------------------
#  RELEASE - porta online la bacheca.
#
#  Il principio che questo file rispetta:
#  l'artefatto si costruisce UNA volta e si promuove. Chi va in produzione
#  SCARICA quell'artefatto, non ne costruisce un altro.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    branches: [main]

  # Partenza a mano = pulsante di ROLLBACK. Se l'input e' vuoto si pubblica
  # HEAD di main, come fa il push.
  workflow_dispatch:
    inputs:
      versione_da_ripubblicare:
        description: "SHA corto di una build gia' collaudata (vuoto = ultimo commit di main)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  # -------------------------------------------------- 1. costruisci UNA volta
  build:
    name: Costruisci e sigilla l'artefatto
    runs-on: ubuntu-latest
    outputs:
      versione: ${{ steps.versione.outputs.valore }}
    steps:
      - uses: actions/checkout@v4
        with:
          # tutta la storia del repository: senza, non potresti tornare indietro
          fetch-depth: 0

      # Rollback: si torna al commit indicato PRIMA di costruire, cosi'
      # l'etichetta di versione e il contenuto vengono da quel commit.
      # Lo SHA va in git checkout: se lo passassi come ref: a actions/checkout
      # verrebbe cercato fra branch e tag e il job morirebbe.
      - name: Torna alla versione da ripubblicare
        if: github.event_name == 'workflow_dispatch' && inputs.versione_da_ripubblicare != ''
        run: |
          echo "Ripubblico la build ${{ inputs.versione_da_ripubblicare }}"
          git checkout "${{ inputs.versione_da_ripubblicare }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Prima si decide QUALE versione si sta costruendo, poi si costruisce:
      # cosi anche in caso di rollback l'etichetta nella pagina e quella giusta.
      - name: Calcola l'etichetta di versione
        id: versione
        run: |
          VALORE="$(git rev-parse --short=7 HEAD)"
          echo "valore=$VALORE" >> "$GITHUB_OUTPUT"
          echo "VERSIONE=$VALORE" >> "$GITHUB_ENV"
          echo "### Bacheca ITS - build \`$VALORE\`" >> "$GITHUB_STEP_SUMMARY"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: sito
          path: dist/
          retention-days: 30

  # -------------------------------------------------- 2. collauda l'artefatto (GIA' FATTO)
  collaudo:
    name: Collaudo sull'artefatto, non sul codice
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sito
          path: dist

      - name: La pagina esiste, non e' vuota e ha il foglio di stile
        run: |
          test -s dist/index.html || { echo "index.html mancante o vuoto"; exit 1; }
          test -s dist/style.css  || { echo "style.css mancante"; exit 1; }
          grep -q "Bacheca avvisi" dist/index.html || { echo "titolo non trovato"; exit 1; }
          echo "artefatto collaudato"

  # -------------------------------------------------- 3. l'umano nel mezzo
  approvazione:
    name: Approvazione umana prima della produzione
    needs: [build, collaudo]
    runs-on: ubuntu-latest

    # L'environment "produzione" (Settings -> Environments) con i Required
    # reviewers: e' questo che ferma il nastro e aspetta un umano.
    environment:
      name: produzione

    steps:
      - name: Registra chi ha approvato
        run: |
          echo "Release ${{ needs.build.outputs.versione }} approvata da ${{ github.actor }}"
          echo "### Approvata la release \`${{ needs.build.outputs.versione }}\` da @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------- 4. pubblica
  pubblica:
    name: Pubblica sul branch gh-pages
    runs-on: ubuntu-latest

    # Solo dopo build, collaudo e approvazione: e serve il permesso di scrivere
    # sul repository per spingere su gh-pages.
    needs: [build, collaudo, approvazione]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Si promuove, non si ricostruisce: lo stesso artefatto collaudato.
      - uses: actions/download-artifact@v4
        with:
          name: sito
          path: sito

      - name: Spingi il contenuto sul branch gh-pages
        run: |
          VERSIONE="${{ needs.build.outputs.versione }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp -r sito/. .
          rm -rf sito
          touch .nojekyll
          git add -A
          git commit -m "pubblica versione $VERSIONE"
          git push --force origin HEAD:gh-pages
          echo "### In produzione la versione \`$VERSIONE\`" >> "$GITHUB_STEP_SUMMARY"
